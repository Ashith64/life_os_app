name: Build LifeOS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🏗️ Generate Missing Android Build Files
        run: |
          mkdir -p backup
          # Backup our custom native Android code
          cp android/app/src/main/AndroidManifest.xml backup/
          cp android/app/src/main/kotlin/com/example/life_os/MainActivity.kt backup/
          
          # Generate the missing build.gradle files that normally require a local install
          flutter create --project-name life_os --platforms android .
          
          # Restore our custom native Android code
          cp backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp backup/MainActivity.kt android/app/src/main/kotlin/com/example/life_os/MainActivity.kt

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🛠️ Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 📱 Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
