name: Build LifeOS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0' # Or latest stable

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🛠️ Run Code Generation (Drift DB bindings)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 📱 Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LifeOS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
